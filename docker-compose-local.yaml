version: '3.8'
services:

  archive:
    image: starskvim/starskvim-archive-app
    container_name: 'starskvim-archive-app'
    restart: always
    depends_on:
      - mongo
      - minio
    ports:
      - 8081:8081

  front:
    image: starskvim/starskvim-archive-front:latest
    container_name: 'starskvim-archive-front'
    restart: always
    ports:
      - 3000:3000

  mongo:
    image: mongo
    container_name: 'mongo'
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - "C:/DbStorage/mongo:/data/db"

  minio:
    image: minio/minio:latest
    container_name: 'minio'
    restart: always
    ports:
      - "9000:9000"
      - "9099:9099"
    volumes:
      - "C:/DbStorage/minio:/data"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server --address ":9099" --console-address ":9000" /data

  elasticsearch:
    image: 'elasticsearch:8.19.19'
    container_name: 'elasticsearch'
    restart: always
    ports:
      - '9200:9200'
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - "C:/DbStorage/elasticsearch:/usr/share/elasticsearch/data"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  kibana:
    image: 'kibana:8.19.19'
    container_name: 'kibana'
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M